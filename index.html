<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Question</title>
  <style>
    :root{
      --bg:#0b0f19; --card:#121a2b; --text:#e8eefc; --muted:#a9b4d0;
      --primary:#7c5cff; --danger:#ff5c7a;

      --img:url("");
      --imgBlur: 0px;
      --imgDim: 0.0;
      --imgShow: 0; /* 0 hidden, 1 visible */
    }

    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      background:var(--bg); color:var(--text);
      font-family:system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      padding:24px;
      overflow:hidden;
    }

    /* Background image layer (revealed after answer) */
    body::before{
      content:"";
      position:fixed; inset:0;
      background-image: var(--img);
      background-size: cover;
      background-position: center;
      filter: blur(var(--imgBlur));
      transform: scale(1.05);
      opacity: var(--imgShow);
      transition: opacity 450ms ease;
      z-index:0;
    }
    body::after{
      content:"";
      position:fixed; inset:0;
      background: rgba(0,0,0,var(--imgDim));
      opacity: var(--imgShow);
      transition: opacity 450ms ease;
      z-index:1;
    }

    /* Fireworks canvas */
    #fxCanvas{
      position:fixed; inset:0;
      z-index:4;
      pointer-events:none;
      display:none;
    }

    .card{
      width:min(560px, 100%); background:var(--card); border-radius:18px;
      padding:22px; box-shadow:0 10px 30px rgba(0,0,0,.35);
      border:1px solid rgba(255,255,255,.06);
      position:relative;
      z-index:2;
      backdrop-filter: blur(8px);
    }

    h1{ margin:0 0 6px; font-size:22px; }
    .sub{ margin:0 0 18px; color:var(--muted); line-height:1.4; }
    .q{ font-size:22px; margin:14px 0 18px; line-height:1.3; }
    .btns{ display:flex; gap:10px; flex-wrap:wrap; position:relative; }
    button{
      border:0; border-radius:12px; padding:12px 14px; cursor:pointer;
      color:var(--text); background:rgba(255,255,255,.08);
      font-weight:800; transition:.15s transform, .15s opacity;
      user-select:none;
      touch-action:manipulation;
    }
    button:hover{ transform:translateY(-1px); opacity:.95; }
    .yes{ background:var(--primary); position:relative; overflow:hidden; }
    .no{ background:var(--danger); }
    .maybe{ background:rgba(255,255,255,.12); }
    .yesbut{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.10); }

    .no.dodgy{ position:relative; will-change: transform, left, top; }

    .result{
      margin-top:18px; padding:14px; border-radius:12px;
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.06);
      display:none;
    }
    .small{ margin-top:10px; color:var(--muted); font-size:12px; }
    .actions{ margin-top:12px; display:flex; gap:10px; flex-wrap:wrap; }
    .wa{ background:#25D366; color:#0b1b10; font-weight:900; }
    .copy{ background:rgba(255,255,255,.10); color:var(--text); font-weight:800; }

    .termsWrap{ margin-top:12px; display:none; gap:10px; flex-direction:column; }
    textarea{
      width:100%;
      min-height:86px;
      resize:vertical;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.10);
      background:rgba(0,0,0,.18);
      color:var(--text);
      padding:12px;
      font:inherit;
      line-height:1.35;
      outline:none;
    }
    .saveTerms{
      align-self:flex-start;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.10);
      font-weight:900;
    }

    /* Heart burst */
    .heart{
      position:fixed;
      left:0; top:0;
      font-size:18px;
      pointer-events:none;
      z-index:3;
      animation: floatUp 900ms ease-out forwards;
      opacity:0.95;
      transform: translate(-50%, -50%);
    }
    @keyframes floatUp{
      0%   { transform: translate(-50%, -50%) scale(1); opacity:0.95; }
      100% { transform: translate(-50%, -140px) scale(1.8); opacity:0; }
    }
  </style>
</head>
<body>
  <canvas id="fxCanvas"></canvas>

  <div class="card">
    <h1 id="title">Loading…</h1>
    <p class="sub" id="subtitle"></p>

    <div class="q" id="question"></div>

    <div class="btns" id="btnRow">
      <button class="yes" id="yesBtn">Yes</button>
      <button class="yesbut" id="yesButBtn">Yes but…</button>
      <button class="maybe" id="maybeBtn">Maybe</button>
      <button class="no" id="noBtn">No</button>
    </div>

    <div class="result" id="resultBox">
      <div id="resultMsg"></div>

      <div class="termsWrap" id="termsWrap">
        <textarea id="termsInput" placeholder=""></textarea>
        <button class="saveTerms" id="saveTermsBtn">Save my terms ✅</button>
        <div class="small" id="termsSavedNote"></div>
      </div>

      <div class="actions" id="actionRow" style="display:none;">
        <button class="wa" id="waBtn">Share to WhatsApp</button>
        <button class="copy" id="copyBtn">Copy response</button>
      </div>

      <div class="small" id="storedNote"></div>
    </div>

    <div class="small">
      Choose wisely madam 🙃
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  function applyTheme(theme){
    if(!theme) return;
    const root = document.documentElement.style;
    if(theme.background) root.setProperty('--bg', theme.background);
    if(theme.card) root.setProperty('--card', theme.card);
    if(theme.text) root.setProperty('--text', theme.text);
    if(theme.muted) root.setProperty('--muted', theme.muted);
    if(theme.primary) root.setProperty('--primary', theme.primary);
    if(theme.danger) root.setProperty('--danger', theme.danger);
  }

  function applyImageSettings(imgCfg){
    if(!imgCfg || !imgCfg.enabled || !imgCfg.filename) return;
    const root = document.documentElement.style;
    root.setProperty('--img', `url("${imgCfg.filename}")`);
    root.setProperty('--imgBlur', (imgCfg.blurPx ?? 6) + "px");
    root.setProperty('--imgDim', String(imgCfg.dim ?? 0.45));
  }

  function revealImageIfConfigured(cfg){
    const imgCfg = cfg.image || {};
    const root = document.documentElement.style;
    if(imgCfg.enabled && imgCfg.filename){
      // If revealOnlyAfterAnswer is true, we only flip it when an answer is recorded
      if(!imgCfg.revealOnlyAfterAnswer){
        root.setProperty('--imgShow', "1");
      }
    }
  }

  function revealImageNow(cfg){
    const imgCfg = cfg.image || {};
    if(!(imgCfg.enabled && imgCfg.filename)) return;
    document.documentElement.style.setProperty('--imgShow', "1");
  }

  function burstHearts(count = 18){
    const emojis = ["💖","💘","💝","💕","💗","❤️"];
    for(let i=0;i<count;i++){
      const h = document.createElement("div");
      h.className = "heart";
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      const x = (window.innerWidth * 0.2) + Math.random() * (window.innerWidth * 0.6);
      const y = (window.innerHeight * 0.35) + Math.random() * (window.innerHeight * 0.25);
      h.style.left = x + "px";
      h.style.top = y + "px";
      h.style.animationDuration = (650 + Math.random()*500) + "ms";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1200);
    }
  }

  // --- FIREWORKS (simple particle bursts) ---
  function startFireworks(durationMs = 2200){
    const canvas = $("fxCanvas");
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;

    function resize(){
      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    resize();
    window.addEventListener("resize", resize, { passive:true });

    canvas.style.display = "block";

    const particles = [];
    const colors = ["#ff4f9a","#ffeaf7","#7c5cff","#ff6b6b","#ffffff"];

    function burst(){
      const x = window.innerWidth * (0.2 + Math.random()*0.6);
      const y = window.innerHeight * (0.15 + Math.random()*0.45);
      const n = 60 + Math.floor(Math.random()*50);
      for(let i=0;i<n;i++){
        const ang = Math.random() * Math.PI * 2;
        const sp = 2 + Math.random()*4.2;
        particles.push({
          x, y,
          vx: Math.cos(ang)*sp,
          vy: Math.sin(ang)*sp,
          life: 60 + Math.random()*30,
          c: colors[Math.floor(Math.random()*colors.length)]
        });
      }
    }

    let frames = 0;
    const totalFrames = Math.max(1, Math.floor(durationMs / 16));

    function tick(){
      frames++;
      // fade trail
      ctx.fillStyle = "rgba(0,0,0,0.18)";
      ctx.fillRect(0,0,window.innerWidth,window.innerHeight);

      // periodic bursts
      if(frames % 12 === 1) burst();

      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06; // gravity
        p.vx *= 0.985;
        p.vy *= 0.985;
        p.life -= 1;

        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
        ctx.fillStyle = p.c;
        ctx.fill();

        if(p.life <= 0) particles.splice(i,1);
      }

      if(frames < totalFrames){
        requestAnimationFrame(tick);
      } else {
        canvas.style.display = "none";
        ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
        window.removeEventListener("resize", resize);
      }
    }
    // start with a couple bursts
    burst(); burst();
    requestAnimationFrame(tick);
  }

  function buildShareText(cfg, choice, terms){
    const base = cfg.whatsappShareText || "I answered the Valentine question:";
    const link = location.href;
    let t = `${base}\n\nAnswer: ${choice}`;
    if(terms && terms.trim()) t += `\nTerms: ${terms.trim()}`;
    t += `\nLink: ${link}`;
    return t;
  }

  async function copyToClipboard(text){
    try{
      await navigator.clipboard.writeText(text);
      $("copyBtn").textContent = "Copied ✅";
      setTimeout(()=> $("copyBtn").textContent = "Copy response", 1400);
    }catch{
      $("copyBtn").textContent = "Copy failed";
      setTimeout(()=> $("copyBtn").textContent = "Copy response", 1400);
    }
  }

  function setShareButtons(cfg, choice, terms){
    const shareText = buildShareText(cfg, choice, terms);
    $("waBtn").onclick = () => window.open(
      "https://wa.me/?text=" + encodeURIComponent(shareText),
      "_blank",
      "noopener,noreferrer"
    );
    $("copyBtn").onclick = () => copyToClipboard(shareText);
  }

  function showResult(choice, message, cfg, opts = {}){
    const key = "valentine_answer";
    const payload = { choice, at: new Date().toISOString(), terms: opts.terms || "" };
    localStorage.setItem(key, JSON.stringify(payload));

    // Reveal photo AFTER first answer (if configured)
    revealImageNow(cfg);

    $("resultMsg").textContent = message;
    $("storedNote").textContent = `Saved on this device: ${choice} (${payload.at})`;
    $("resultBox").style.display = "block";
    $("actionRow").style.display = "flex";

    if(opts.showTerms){
      $("termsWrap").style.display = "flex";
      $("termsInput").value = payload.terms || "";
      $("termsSavedNote").textContent = payload.terms ? "Terms saved ✅" : "";
    } else {
      $("termsWrap").style.display = "none";
      $("termsSavedNote").textContent = "";
    }

    setShareButtons(cfg, choice, payload.terms);
  }

  function enableNoDodge(cfg){
    const dodgeCfg = cfg.noButtonDodge || {};
    if(!dodgeCfg.enabled) return;

    const noBtn = $("noBtn");
    const row = $("btnRow");
    const radius = dodgeCfg.radiusPx ?? 90;
    const maxDodges = dodgeCfg.maxDodges ?? 10;
    let dodges = 0;

    row.style.position = "relative";
    noBtn.classList.add("dodgy");

    function makeAbsolute(){
      const r = noBtn.getBoundingClientRect();
      const pr = row.getBoundingClientRect();
      noBtn.style.position = "absolute";
      noBtn.style.left = (r.left - pr.left) + "px";
      noBtn.style.top  = (r.top  - pr.top)  + "px";
    }

    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

    function dodge(){
      if(dodges >= maxDodges) return;
      dodges++;

      if(getComputedStyle(noBtn).position !== "absolute") makeAbsolute();

      const pr = row.getBoundingClientRect();
      const br = noBtn.getBoundingClientRect();
      const padding = 6;
      const maxX = pr.width - br.width - padding;
      const maxY = pr.height - br.height - padding;

      const newLeft = clamp(Math.random() * maxX, padding, maxX);
      const newTop  = clamp(Math.random() * maxY, padding, maxY);

      noBtn.style.left = newLeft + "px";
      noBtn.style.top  = newTop + "px";
      noBtn.style.transform = `rotate(${(Math.random()*10-5).toFixed(2)}deg)`;

      if(dodges === maxDodges){
        noBtn.textContent = (cfg.noText || "No") + " (fine 🙄)";
        noBtn.style.transform = "none";
      }
    }

    row.addEventListener("mousemove", (e) => {
      if(dodges >= maxDodges) return;
      const br = noBtn.getBoundingClientRect();
      const dx = e.clientX - (br.left + br.width/2);
      const dy = e.clientY - (br.top + br.height/2);
      if(Math.hypot(dx, dy) < radius) dodge();
    });

    noBtn.addEventListener("touchstart", (e) => {
      if(dodges < maxDodges){
        e.preventDefault();
        dodge();
      }
    }, { passive:false });

    noBtn.addEventListener("mouseenter", () => {
      if(dodges < maxDodges) dodge();
    });
  }

  async function init(){
    const res = await fetch("./config.json", { cache: "no-store" });
    const cfg = await res.json();

    document.title = cfg.title || "Question";
    $("title").textContent = cfg.title || "Question";
    $("subtitle").textContent = cfg.subtitle || "";
    $("question").textContent = cfg.question || "Can you be my Valentine?";

    applyTheme(cfg.theme);
    applyImageSettings(cfg.image);

    // Reveal image immediately only if revealOnlyAfterAnswer is false
    revealImageIfConfigured(cfg);

    $("yesBtn").textContent = cfg.yesText || "Yes";
    $("yesButBtn").textContent = cfg.yesButText || "Yes but…";
    $("noBtn").textContent = cfg.noText || "No";
    $("maybeBtn").textContent = cfg.maybeText || "Maybe";
    $("termsInput").placeholder = cfg.yesButPlaceholder || "Type your terms…";
    $("saveTermsBtn").textContent = cfg.yesButSaveText || "Save my terms ✅";

    $("yesBtn").onclick = () => {
      burstHearts(26);
      if((cfg.fireworks && cfg.fireworks.enabled) !== false){
        startFireworks(cfg.fireworks?.durationMs ?? 2200);
      }
      showResult("YES 💘", cfg.afterYes || "Yay!", cfg, { showTerms:false });
    };

    $("yesButBtn").onclick = () => {
      burstHearts(14);
      showResult("YES BUT… 👀", cfg.afterYesBut || "Type your terms below.", cfg, { showTerms:true });
    };

    $("saveTermsBtn").onclick = () => {
      const prev = localStorage.getItem("valentine_answer");
      const p = prev ? JSON.parse(prev) : { choice: "YES BUT… 👀", at: new Date().toISOString(), terms: "" };
      const terms = $("termsInput").value || "";
      const payload = { ...p, choice: "YES BUT… 👀", terms, at: p.at || new Date().toISOString() };
      localStorage.setItem("valentine_answer", JSON.stringify(payload));
      $("termsSavedNote").textContent = "Terms saved ✅";
      revealImageNow(cfg);
      setShareButtons(cfg, payload.choice, payload.terms);
    };

    $("maybeBtn").onclick = () => showResult("MAYBE 💭", cfg.afterMaybe || "Let’s talk.", cfg, { showTerms:false });
    $("noBtn").onclick = () => showResult("NO 🙈", cfg.afterNo || "Okay.", cfg, { showTerms:false });

    enableNoDodge(cfg);

    // If already answered on this device, show it (and reveal image if configured)
    const prev = localStorage.getItem("valentine_answer");
    if(prev){
      try{
        const p = JSON.parse(prev);
        $("resultMsg").textContent = `Previous answer on this device: ${p.choice}`;
        $("storedNote").textContent = `Saved at: ${p.at}`;
        $("resultBox").style.display = "block";
        $("actionRow").style.display = "flex";

        if(cfg.image?.revealOnlyAfterAnswer) revealImageNow(cfg);

        if(p.choice && String(p.choice).includes("YES BUT")){
          $("termsWrap").style.display = "flex";
          $("termsInput").value = p.terms || "";
          $("termsSavedNote").textContent = p.terms ? "Terms saved ✅" : "";
        } else {
          $("termsWrap").style.display = "none";
        }

        setShareButtons(cfg, p.choice, p.terms || "");
      }catch{}
    }
  }

  init().catch(err => {
    $("title").textContent = "Couldn’t load config.json";
    $("subtitle").textContent = String(err);
  });
</script>
</body>
</html>
